name: Zelda News to Discord

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  check-zelda-news:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show Python version
        run: python --version

      - name: Check for Zelda news
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python zelda_news.py

      - name: Save seen articles
        run: |
          git config user.name "Zelda News Bot"
          git config user.email "actions@github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Update seen Zelda news"
            git push
          fi

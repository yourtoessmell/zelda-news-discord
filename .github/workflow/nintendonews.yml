name: Nintendo + Zelda News

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Nintendo + Zelda bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python zelda_news.py

      - name: Save seen links
        run: |
          git config user.name "Nintendo Zelda Bot"
          git config user.email "actions@github.com"

          git add seen.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update seen links"
            git push
          fi
